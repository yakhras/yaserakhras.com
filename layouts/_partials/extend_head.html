{{- /* GoatCounter analytics: page views plus clicks on elements with data-goatcounter-click.
       Production builds only, so local `hugo server` visits are not counted. */ -}}
{{- if and hugo.IsProduction site.Params.goatcounter }}
<script data-goatcounter="https://{{ site.Params.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{{- end }}
