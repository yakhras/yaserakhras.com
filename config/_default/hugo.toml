baseURL = "https://yaserakhras.com/"
title = "Yaser Akhras"
theme = "PaperMod"
enableRobotsTXT = true

# Languages: English at the site root, Arabic under /ar/. A page is translated by putting
# index.ar.md (or _index.ar.md) next to its English file. The language choice is in the
# footer (layouts/_partials/extend_footer.html), not in the header.
defaultContentLanguage = "en"
[languages]
  [languages.en]
    weight = 1
    locale = "en-us"
    languageName = "English"
  [languages.ar]
    weight = 2
    locale = "ar"
    direction = "rtl"
    languageName = "العربية"
    title = "ياسر الأخرس"
    [languages.ar.params.homeInfoParams]
      Title = "ياسر الأخرس"

# Site map: one top-level folder per sector (content/erp, linux, networking, programming).
# Menu entries are set in each sector's _index.md, so a sector kept as draft stays out of the menu.

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  # Odoo versions a module supports (front matter `odoo: ["18.0"]`): badges on cards,
  # filter chips on /erp/ and one page per version at /erp/odoo/<version>/.
  odoo = "odoo"

[permalinks]
  [permalinks.taxonomy]
    odoo = "/erp/odoo/"
  [permalinks.term]
    odoo = "/erp/odoo/:slug/"

[markup.goldmark.renderer]
  unsafe = false

[params]
  defaultTheme = "auto"
  # GoatCounter site code: stats at https://yaserakhras.goatcounter.com (layouts/_partials/extend_head.html)
  goatcounter = "yaserakhras"
  ShowReadingTime = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  # The language choice lives in the footer, so PaperMod's header toggle is off.
  disableLangToggle = true
  # Home page shows only the photo and sector cards: no recent-items list.
  # (PaperMod lists the pages of these sections on the home page.)
  mainSections = []
  # Tags that describe the stack, not the business area: not shown as the area on cards.
  nonAreaTags = ["odoo", "api", "python"]

  [params.homeInfoParams]
    Title = "Yaser Akhras"
    AlignSocialIconsTo = "center"
    # Body is the sector logo grid: data/sectors.toml + layouts/_partials/home_info.html

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yakhras"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:yaser.m.m.as@gmail.com"

  [params.cover]
    hiddenInList = false
